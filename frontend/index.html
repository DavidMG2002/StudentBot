<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentBot - Asistente Inteligente con IA</title>
    <link rel="stylesheet" href="style.css">
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_URL = 'http://localhost:5000/api';

        function StudentBot() {
            const [sistemaCargado, setSistemaCargado] = useState(false);
            const [documentos, setDocumentos] = useState([]);
            const [stats, setStats] = useState({ txt: 0, pdf: 0, chunks: 0 });
            const [mensajes, setMensajes] = useState([{
                tipo: 'StudentBot',
                contenido: '¡Hola! Soy StudentBot 🫦, tu asistente inteligente.\n\nCarga documentos TXT o PDF y pregúntame sobre su contenido.\n\n🌐 Potenciado por Gemini Flash 2.5 >.0',
                time: new Date()
            }]);
            const [pregunta, setPregunta] = useState('');
            const [chunks, setChunks] = useState([]);
            const [loading, setLoading] = useState({ cargar: false, preguntar: false });
            const [config, setConfig] = useState({ carpeta: 'documentos', tamanoChunk: 300, topK: 3 });
            const [error, setError] = useState(null);
            const chatRef = useRef(null);

            useEffect(() => {
                verificarEstado();
                listarDocumentos();
            }, []);

            useEffect(() => {
                if (chatRef.current) {
                    chatRef.current.scrollTop = chatRef.current.scrollHeight;
                }
            }, [mensajes]);

            const verificarEstado = async () => {
                try {
                    const res = await fetch(`${API_URL}/status`);
                    const data = await res.json();
                    if (data.listo) {
                        setSistemaCargado(true);
                        setStats({ txt: data.tipos?.TXT || 0, pdf: data.tipos?.PDF || 0, chunks: data.chunks || 0 });
                    }
                } catch (err) {
                    setError('Backend no disponible. Ejecuta: python backend.py');
                }
            };

            const listarDocumentos = async () => {
                try {
                    const res = await fetch(`${API_URL}/documentos?carpeta=${config.carpeta}`);
                    const data = await res.json();
                    if (data.success) {
                        setDocumentos(data.documentos || []);
                        const txt = data.documentos.filter(d => d.endsWith('.txt')).length;
                        const pdf = data.documentos.filter(d => d.endsWith('.pdf')).length;
                        setStats(prev => ({ ...prev, txt, pdf }));
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const cargarDocumentos = async () => {
                setLoading({ ...loading, cargar: true });
                setError(null);
                try {
                    const res = await fetch(`${API_URL}/cargar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ carpeta: config.carpeta, tamano_chunk: config.tamanoChunk })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSistemaCargado(true);
                        setStats({ txt: data.tipos?.TXT || 0, pdf: data.tipos?.PDF || 0, chunks: data.chunks || 0 });
                        agregarMensaje('StudentBot', `🗹 ¡Sistema cargado!\n\n🕮 ${data.documentos} docs | ✂️ ${data.chunks} chunks\n${data.gemini_habilitado ? '✓✓ Gemini activo' : ''}\n\n✅ Haz tu pregunta!`);
                        listarDocumentos();
                    } else {
                        setError(data.error);
                    }
                } catch (err) {
                    setError('Error de conexión con el backend');
                } finally {
                    setLoading({ ...loading, cargar: false });
                }
            };

            const enviarPregunta = async () => {
                if (!pregunta.trim() || !sistemaCargado) return;
                const p = pregunta;
                agregarMensaje('usuario', p);
                setPregunta('');
                setChunks([]);
                setLoading({ ...loading, preguntar: true });

                try {
                    const res = await fetch(`${API_URL}/preguntar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pregunta: p, top_k: config.topK, usar_gemini: true })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setChunks(data.chunks || []);
                        agregarMensaje('StudentBot', data.respuesta || 'Sin resultados', data.estadisticas?.gemini_usado);
                    } else {
                        agregarMensaje('StudentBot', `|X| ${data.error}`);
                    }
                } catch (err) {
                    agregarMensaje('StudentBot', '|X| Error al procesar la pregunta');
                } finally {
                    setLoading({ ...loading, preguntar: false });
                }
            };

            const agregarMensaje = (tipo, contenido, gemini = false) => {
                setMensajes(prev => [...prev, { tipo, contenido, gemini, time: new Date() }]);
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="logo">
                            <div className="logo-icon">🧠</div>
                            <div>
                                <h1>StudentBot</h1>
                                <p>Asistente Inteligente con IA</p>
                            </div>
                        </div>
                        <div className={`status ${sistemaCargado ? 'active' : 'inactive'}`}>
                            {sistemaCargado ? '🗹 Activo' : '|X| Inactivo'}
                        </div>
                    </div>

                    {error && (
                        <div className="error">
                            |X| {error}
                            <button onClick={() => setError(null)} className="close-btn">×</button>
                        </div>
                    )}

                    <div className="main">
                        <div>
                            <div className="card">
                                <h3>⚙️ Configuración</h3>
                                <input
                                    type="text"
                                    className="input"
                                    value={config.carpeta}
                                    onChange={e => setConfig({...config, carpeta: e.target.value})}
                                    placeholder="Carpeta"
                                />
                                <label className="label">✂️ Chunks: {config.tamanoChunk}</label>
                                <input
                                    type="range"
                                    className="slider"
                                    min="100"
                                    max="500"
                                    value={config.tamanoChunk}
                                    onChange={e => setConfig({...config, tamanoChunk: Number(e.target.value)})}
                                />
                                <label className="label">🔍 Resultados: {config.topK}</label>
                                <input
                                    type="range"
                                    className="slider"
                                    min="1"
                                    max="5"
                                    value={config.topK}
                                    onChange={e => setConfig({...config, topK: Number(e.target.value)})}
                                />
                                <button className="btn btn-primary" onClick={cargarDocumentos} disabled={loading.cargar}>
                                    {loading.cargar ? (
                                        <React.Fragment>
                                            <div className="spinner"></div>
                                            <span>Cargando...</span>
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>🔝 Cargar Documentos</React.Fragment>
                                    )}
                                </button>
                            </div>

                            <div className="card card-spacing">
                                <h3>
                                    📄 Documentos 
                                    <button onClick={listarDocumentos} className="refresh-btn">🔄</button>
                                </h3>
                                <div className="doc-list">
                                    {documentos.length === 0 ? (
                                        <div className="empty">No hay documentos</div>
                                    ) : (
                                        documentos.map((doc, i) => (
                                            <div key={i} className="doc-item">
                                                {doc.endsWith('.pdf') ? '📕' : '📄'} {doc}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            <div className="stats">
                                <div className="stat-box">
                                    <div className="stat-value">{stats.txt}</div>
                                    <div className="stat-label">TXT</div>
                                </div>
                                <div className="stat-box">
                                    <div className="stat-value">{stats.pdf}</div>
                                    <div className="stat-label">PDF</div>
                                </div>
                                <div className="stat-box">
                                    <div className="stat-value">{stats.chunks}</div>
                                    <div className="stat-label">Chunks</div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div className="card chat-container">
                                <div className="messages" ref={chatRef}>
                                    {mensajes.map((msg, i) => (
                                        <div key={i} className={`message ${msg.tipo}`}>
                                            <div className="message-header">
                                                {msg.tipo === 'StudentBot' ? '🦿 StudentBot' : '👤 Tú'}
                                                {msg.gemini && <span className="gemini-badge">🫦 Gemini</span>}
                                                <span className="timestamp">
                                                    {msg.time.toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'})}
                                                </span>
                                            </div>
                                            {msg.contenido.split('\n').map((line, j) => (
                                                <div key={j}>{line}</div>
                                            ))}
                                        </div>
                                    ))}
                                    {loading.preguntar && (
                                        <div className="loading">
                                            <div className="spinner"></div>
                                            Procesando...
                                        </div>
                                    )}
                                </div>
                                <div className="chat-input">
                                    <input
                                        type="text"
                                        value={pregunta}
                                        onChange={e => setPregunta(e.target.value)}
                                        onKeyPress={e => e.key === 'Enter' && enviarPregunta()}
                                        placeholder={sistemaCargado ? "Escribe tu pregunta..." : "Carga documentos primero..."}
                                        disabled={!sistemaCargado}
                                    />
                                    <button onClick={enviarPregunta} disabled={!sistemaCargado || !pregunta.trim()}>
                                        🔍 Buscar
                                    </button>
                                </div>
                            </div>

                            {chunks.length > 0 && (
                                <div className="card chunks">
                                    <h3>🔍 Información Encontrada</h3>
                                    {chunks.map((chunk, i) => (
                                        <div key={i} className="chunk">
                                            <div className="chunk-header">
                                                {chunk.fuente.includes('PDF') ? '📕' : '📄'} {chunk.fuente}
                                                <span className="relevance">{(chunk.relevancia * 100).toFixed(0)}%</span>
                                            </div>
                                            <div className="chunk-text">{chunk.texto}</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<StudentBot />, document.getElementById('root'));
    </script>
</body>
</html>
